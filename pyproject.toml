[project]
name = "pplp"
version = "0.1.0"
description = "Privacy-preserving link prediction library"
requires-python = ">=3.9"
dependencies = [
    "openmined-psi>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
tunnel = ["pyngrok>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib/pplp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
pplp-server = "pplp.server.app:main"

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.6",
]
